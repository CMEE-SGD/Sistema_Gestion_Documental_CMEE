server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El mime.types por defecto de nginx no incluye .mjs, asi que lo sirve
    # como application/octet-stream y los navegadores rechazan cargarlo como
    # modulo ES (usado por el worker de pdfjs para leer/firmar PDFs).
    location ~* \.mjs$ {
        default_type application/javascript;
    }
}
